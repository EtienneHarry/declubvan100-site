name: check

on:
  push:
  pull_request:

# Alleen lezen. De job draait npm ci, en daarmee de installatiescripts van elk
# pakket in de boom; met de standaardrechten had een gecompromitteerd pakket
# branches kunnen pushen. main is beschermd, de redactie/-branches niet.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check
