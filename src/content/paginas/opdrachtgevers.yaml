titel: Voor ondernemers — De Club van 100
beschrijving: >-
  Je krijgt geen willekeurige invalkracht. Je krijgt iemand die weet hoe een tap
  onder druk werkt. Wij regelen de mensen in en rond Groningen.
secties:
  - discriminant: hero
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-l
        breedte: basis
      kop: Voor onder­nemers.
      knop: {}
      tweedeKnop: {}
      beeld:
        discriminant: false
      schicht: true
      vullend: false
      dubbellaags: false
  - discriminant: rijke-tekst
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: smal
      kop: Echte mensen. *Geen nummertjes, maar [1 van de 100].*
      inhoud: >
        Een vol terras. Een groot evenement. Iemand die onverwacht uitvalt. Of
        simpelweg een weekend waarin je nét wat extra handen kunt gebruiken. De
        Club van 100 koppelt horecazaken en evenementen aan een vaste community
        van flexibele horecamedewerkers.


        Geen eindeloze zoektocht naar personeel, maar toegang tot een club
        mensen die graag werkt en zelf kiest wanneer ze beschikbaar zijn.
      schichtLijst: false
  - discriminant: formulier
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-l
        breedte: basis
      variant: inhuren
      bovenkop: Aan de slag
      kop: Goede mensen op het moment dat je ze {nodig hebt.}
      tekst: Laat weten wat er speelt, dan kijken we wie erbij past.
  - discriminant: citaten
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: basis
      bovenkop: Wat opdrachtgevers zeggen
      items:
        - citaat: >-
            "Zeker een leuke avond gehad en top mensen hebben jullie gestuurd.
            Ze hebben het fantastisch gedaan."
          naam: De Speld
        - citaat: '"Leuke mensen, harde werkers"'
          naam: Stadslab Groningen
  - discriminant: accordeon
    value:
      weergave:
        achtergrond: bruin
        ruimte: sectie-m
        breedte: smal
      kop: Veelgestelde vragen
      items:
        - vraag: Wat kost het?
          antwoord: >
            Het factuurtarief hangt af van het soort opdracht en de
            werkzaamheden. Neem contact op en je hoort direct het actuele
            tarief.
        - vraag: Hoe snel kunnen jullie iemand regelen?
          antwoord: >
            Vraag bij voorkeur zo vroeg mogelijk aan, maar last-minute kan ook —
            als er iemand beschikbaar is soms dezelfde dag nog. Een inzet is
            definitief zodra wij hem bevestigd hebben.
        - vraag: Wat als er iemand niet komt opdagen?
          antwoord: >
            Neem direct contact op met De Club. Wij benaderen meteen beschikbare
            Clubleden en regelen zo snel mogelijk vervanging. Je betaalt nooit
            voor niet-gewerkte uren.
        - vraag: Hoe zit het met de factuur?
          antwoord: >
            Je krijgt achteraf een factuur op basis van de daadwerkelijk
            gewerkte uren. Betaaltermijn: 30 dagen.
        - vraag: Werken jullie ook buiten Groningen?
          antwoord: >
            We zitten in Groningen, maar inzet kan door heel Nederland —
            afhankelijk van de opdracht en de beschikbaarheid van Clubleden.
        - vraag: Wat voor werk pakken jullie aan?
          antwoord: >
            Bediening, bar, barista's, gastheren en gastvrouwen, festivals,
            evenementen, garderobe en afwas. Breed inzetbaar binnen horeca en
            events.
        - vraag: Wat is de minimale afname?
          antwoord: |
            Vanaf één medewerker. Er is geen minimum per opdracht.
