      inhoud: |
        De Club van 100 vindt het belangrijk dat je weet wat er met je gegevens gebeurt. Deze verklaring legt uit welke gegevens wij via deze website verzamelen, waarom we dat doen en wat je rechten zijn. Geen kleine lettertjes, gewoon wat er gebeurt.

        ## Wie wij zijn

        De Club van 100\
        Neutronstraat 10, 9743 AM Groningen\
        KvK 93868405\
        [contact@declubvan.nl](mailto:contact@declubvan.nl)

        Wij zijn verantwoordelijk voor de verwerking van je gegevens zoals beschreven in deze verklaring.

        ## Welke gegevens wij verzamelen

        **Als je het formulier invult.** Je naam, je e-mailadres, je telefoonnummer als je dat invult, en wat je zelf in het bericht schrijft.

        **Als je je aanmeldt bij de club.** Daarnaast vragen we naar je horeca-ervaring en waar je enthousiast van wordt. Dat helpt ons inschatten of je bij De Club past.

        **Als je personeel zoekt.** Dan vragen we ook voor welke zaak of welk bedrijf het is, zodat we weten met wie we te maken hebben.

        Meer vragen we niet.

        **Als je ons mailt of belt.** Dan hebben we de gegevens die je zelf deelt.

        **Als je de site bezoekt.** Onze hostingpartij legt technische gegevens vast die nodig zijn om de site te laten werken en te beschermen tegen misbruik, zoals je IP-adres en het tijdstip van je bezoek. Wij gebruiken die gegevens niet om je te volgen.

        Wij gebruiken geen cookies, geen bezoekersstatistieken en geen advertentiescripts. Er staat dus ook geen cookiemelding op deze site.

        ## Waarom wij die gegevens gebruiken

        Wij gebruiken je gegevens om je vraag te beantwoorden, om een aanmelding te beoordelen, en om contact met je op te nemen over een klus. Dat doen we omdat je ons daarom vraagt, en omdat wij er belang bij hebben om te kunnen reageren op wie zich bij ons meldt. Wij gebruiken je gegevens niet voor iets anders, en wij verkopen ze niet.

        ## Hoe lang wij ze bewaren

        Aanmeldingen voor de club bewaren wij twaalf maanden. Word je onderdeel van de club, dan bewaren wij je gegevens zolang je meedoet en zolang de wet dat van ons vraagt.

        Aanvragen van opdrachtgevers bewaren wij zes maanden, of langer als er een opdracht uit voortkomt en wij administratie moeten bewaren. Voor onze financiële administratie geldt een wettelijke bewaartermijn van zeven jaar.

        Wil je dat wij je gegevens eerder verwijderen, laat het weten. Dat kan bijna altijd.

        ## Met wie wij ze delen

        Wij delen je gegevens alleen met partijen die ons helpen deze site en onze mail te laten werken:

        - Vercel, waar deze website draait
        - Resend, dat de berichten uit het formulier naar onze mailbox stuurt
        - De partij waar onze mailbox draait

        Met deze partijen hebben wij afspraken gemaakt over de omgang met jouw gegevens. Zij mogen die alleen gebruiken voor wat wij ze opdragen. Sommige van deze partijen staan buiten de Europese Unie; in dat geval zorgen wij dat er passende waarborgen zijn.

        Verder delen wij niets met derden, tenzij de wet ons daartoe verplicht.

        ## Wat je rechten zijn

        Je mag ons vragen welke gegevens wij van je hebben, en je mag ze laten corrigeren of verwijderen. Je mag bezwaar maken tegen het gebruik ervan, en je mag vragen om een kopie in een gangbaar bestandsformaat.

        Stuur je verzoek naar [contact@declubvan.nl](mailto:contact@declubvan.nl). Wij reageren binnen een maand. Om te voorkomen dat wij gegevens aan de verkeerde persoon geven, kunnen wij je vragen jezelf te identificeren.

        Ben je het niet eens met hoe wij met je gegevens omgaan, laat het ons weten. Je hebt ook het recht een klacht in te dienen bij de Autoriteit Persoonsgegevens.

        ## Hoe wij ze beveiligen

        De site draait volledig over een beveiligde verbinding. Alleen de mensen binnen De Club van 100 die je bericht nodig hebben, kunnen erbij. Merk je toch iets wat niet klopt, mail dan [contact@declubvan.nl](mailto:contact@declubvan.nl).

        ## Wijzigingen

        Verandert er iets aan wat wij met je gegevens doen, dan passen wij deze verklaring aan. Bovenaan staat wanneer we dat voor het laatst gedaan hebben.
